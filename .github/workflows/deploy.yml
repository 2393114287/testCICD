name: Vue CI&CD

# 触发时机：main分支推送 + 页面手动运行流水线
on:
  push:
    branches: [ main ]
  workflow_dispatch: # 支持网页手动点击运行

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取仓库代码，升级v5消除Node版本警告
      - name: Checkout code
        uses: actions/checkout@v5

      # 2. 配置Node18环境，完善npm缓存配置
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json # 锁定缓存文件

      # 3. 安装项目依赖
      - name: Install dependencies
        run: npm install

      # 4. 代码校验 + 打包生成dist静态资源
      - name: Lint & Build
        run: |
          npm run lint
          npm run build

      # 5. 部署dist目录到gh-pages分支，供给GitHub Pages读取
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist # 打包产物目录
          force_orphan: true
          commit_message: "deploy ${{ github.sha }} [skip ci]"