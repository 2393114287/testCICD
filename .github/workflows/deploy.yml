name: Vue CI&CD

# 触发时机：main分支有代码推送时执行流水线
on:
  push:
    branches: [ main ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest  # 运行环境：ubuntu系统虚拟机
    steps:
      # 1. 拉取当前仓库代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 配置node环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm' # 缓存依赖，加快下次打包速度

      # 3. 安装依赖
      - name: Install dependencies
        run: npm install

      # 4. CI环节：代码检查 + 打包构建1
      - name: Lint & Build
        run: |
          npm run lint
          npm run build

      # 5. CD环节：把dist部署到GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist